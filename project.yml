name: MotionCues

options:
  bundleIdPrefix: com.motioncues
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal build: no team required to run locally.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      # Required for `@testable import MotionCues`.
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  MotionCues:
    type: application
    platform: macOS
    sources:
      - path: MotionCues
        excludes:
          - "Resources/Info.plist"
          - "Resources/MotionCues.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncues.MotionCues
        PRODUCT_NAME: MotionCues
        INFOPLIST_FILE: MotionCues/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MotionCues/Resources/MotionCues.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: CoreMotion.framework
      - sdk: Network.framework

  MotionCuesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MotionCues
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncues.MotionCuesTests
        PRODUCT_NAME: MotionCuesTests
        SWIFT_MODULE_NAME: MotionCuesTests
        GENERATE_INFOPLIST_FILE: YES
        # Resolve @testable symbols against the host app binary.
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Offline generator for the README / social demo asset. Compiles the real
  # engine and renderer sources directly, so the dots it draws are the shipping
  # code's output rather than a reimplementation. Not part of the app.
  DemoRenderer:
    type: tool
    platform: macOS
    sources:
      - path: Tools/DemoRenderer
      - path: Shared
      - path: MotionCues/Motion
        excludes:
          - "HeadphoneMotionProvider.swift"
      - path: MotionCues/Rendering
      - path: MotionCues/Settings/RenderSettings.swift
    settings:
      base:
        PRODUCT_NAME: DemoRenderer
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncues.DemoRenderer
        SWIFT_MODULE_NAME: DemoRenderer
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: NO

  MotionCuesIOS:
    type: application
    platform: iOS
    sources:
      - path: MotionCuesIOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/MotionCuesIOS.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncues.MotionCuesIOS
        PRODUCT_NAME: MotionCues
        INFOPLIST_FILE: MotionCuesIOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MotionCuesIOS/Resources/MotionCuesIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: CoreMotion.framework
      - sdk: CoreLocation.framework
      - sdk: Network.framework

schemes:
  MotionCues:
    build:
      targets:
        MotionCues: all
        MotionCuesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MotionCuesTests
    archive:
      config: Release

  DemoRenderer:
    build:
      targets:
        DemoRenderer: all
    run:
      config: Release

  MotionCuesIOS:
    build:
      targets:
        MotionCuesIOS: all
    run:
      config: Debug
    archive:
      config: Release
