<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
html,body{width:1024px;height:1024px;overflow:hidden;background:transparent}
/* macOS icons sit in a rounded square inset from the canvas, not edge to edge. */
#tile{position:absolute;left:92px;top:92px;width:840px;height:840px;
  border-radius:188px;overflow:hidden;
  background:radial-gradient(115% 115% at 32% 22%,#41536e 0%,#1d2434 52%,#0f1219 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.10), inset 0 -3px 0 rgba(0,0,0,.35);}
.p{position:absolute;background:#fff}
</style></head><body>
<div id="tile"></div>
<script>
// The mark is the cue itself: particles streaming radially outward, which is
// what accelerating looks like in the app. Three rings only — the first draft
// had five and read as a sunburst rather than as motion.
const tile = document.getElementById('tile');
const C = 420, MAX = 330;
for (let ring = 1; ring <= 3; ring++) {
  const r = 96 + ring * 78;
  const n = 7 + ring * 4;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + ring * 0.55;
    const size  = 15 + ring * 9;
    const trail = 14 + ring * 34;
    const alpha = 0.30 + ring * 0.23;
    const len = size + trail;
    if (r + len / 2 > MAX) continue;          // never clip against the tile
    const el = document.createElement('div');
    el.className = 'p';
    el.style.cssText =
      `left:${C + Math.cos(a)*r - len/2}px;top:${C + Math.sin(a)*r - size/2}px;` +
      `width:${len}px;height:${size}px;border-radius:${size/2}px;opacity:${alpha};` +
      `transform:rotate(${a}rad);transform-origin:${len/2}px ${size/2}px;`;
    tile.appendChild(el);
  }
}
</script></body></html>
